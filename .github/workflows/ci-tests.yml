name: CI executables

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/**"
      - "plugins/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - "tests/test_github_action_pins.py"

defaults:
  run:
    shell: bash

jobs:
  codex-rig:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      # Bytecode written beside a packaged file changes what the manifest checks hash over.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The job-level UV_PYTHON is uv's own equivalent of --python, so no uv run below
      # repeats the version; the action input installs that interpreter.
      - name: 📦 Install uv and Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: 🐧 Verify Codex Rig entrypoints
        if: runner.os != 'Windows'
        run: |
          uv run --no-project python plugins/codex-rig/scripts/validate_package.py
          uv run --no-project python plugins/codex-rig/shared/collect_pr.py --help

      # Native pwsh, not the Git Bash the job default supplies: it is the shell a Windows user
      # actually invokes these entrypoints from, and the one that surfaced the path defects.
      - name: 🪟 Verify native Codex Rig entrypoints
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --no-project python plugins/codex-rig/scripts/validate_package.py
          uv run --no-project python plugins/codex-rig/shared/collect_pr.py --help

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🟢 Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # The action's python-version input sets UV_PYTHON, uv's equivalent of --python,
      # so the pytest run below does not repeat the matrix version.
      - name: 📦 Install uv and Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Pre-commit regenerates these manifests; CI catches a contributor who bypassed it.
      # Every OS leg matters: the manifest must hash byte-identically on Windows too.
      - name: 🧾 Verify blueprint manifest freshness
        run: |
          uv run --only-group test \
            python plugins/cc_foundry/bin/build_blueprint_manifest.py \
            --scan-dir plugins --check

      # Four workers run the complete suite, including Node, coverage, and subprocess tests; work stealing keeps the
      # few multi-minute tests from landing last on one worker. Coverage is opt-in so local runs stay untraced, and
      # its sources stay out of pyproject's [tool.coverage], which would also configure tests that start their own
      # coverage run. The XML report feeds the informational Codecov upload below.
      # Every test over 0.1 s is listed so per-file cost can be aggregated, not just the 500 slowest.
      - name: 🧪 Run plugin tests (Python bin/ + JS hooks)
        run: |
          uv run --only-group test pytest -n 4 --dist worksteal \
            -W error::DeprecationWarning --durations=500 --durations-min=0.2 \
            --cov=plugins/codemap-py/bin --cov=plugins/codemap-py/src \
            --cov=plugins/cc_develop/bin --cov=plugins/cc_foundry/bin \
            --cov=plugins/cc_oss/bin --cov=plugins/cc_research/bin \
            --cov-report=term-missing --cov-report=html:.reports/coverage \
            --cov-report=xml:coverage.xml

      # Coverage is informational only: an upload failure never fails the job, and codecov.yml
      # marks every status as informational so coverage changes never block a merge.
      - name: 📊 Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: ${{ runner.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
