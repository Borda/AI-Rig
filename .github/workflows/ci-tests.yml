name: CI executables

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/**"
      - "plugins/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - "scripts/**"
      - "tests/**"

defaults:
  run:
    shell: bash

jobs:
  opencode-rig:
    name: opencode-rig (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        node: ["20", "24"]
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # setup-node's dependency cache needs a lockfile, and this package deliberately keeps
      # node_modules and package-lock.json out of version control, so install is uncached.
      - name: 🟢 Set up Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: 📦 Install dependencies
        working-directory: plugins/opencode-rig
        run: npm install --no-audit --no-fund

      # Typecheck, formatting, the Vitest suites, version-source agreement, and the
      # published tarball contract in one gate, so CI cannot pass on a partial check.
      - name: 🧪 Run opencode-rig checks
        working-directory: plugins/opencode-rig
        run: npm run check

  codex-rig:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      # Bytecode written beside a packaged file changes what the manifest checks hash over.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The job-level UV_PYTHON is uv's own equivalent of --python, so no uv run below
      # repeats the version; the action input installs that interpreter.
      - name: 📦 Install uv and Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: 🐧 Verify Codex Rig entrypoints
        if: runner.os != 'Windows'
        run: |
          uv run --no-project python plugins/codex-rig/scripts/validate_package.py
          uv run --no-project python plugins/codex-rig/shared/collect_pr.py --help

      # Native pwsh, not the Git Bash the job default supplies: it is the shell a Windows user
      # actually invokes these entrypoints from, and the one that surfaced the path defects.
      - name: 🪟 Verify native Codex Rig entrypoints
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --no-project python plugins/codex-rig/scripts/validate_package.py
          uv run --no-project python plugins/codex-rig/shared/collect_pr.py --help

      # Pre-commit regenerates these manifests; check byte-identical hashes once per OS.
      - name: 🧾 Verify blueprint manifest freshness
        run: |
          uv run --no-project \
            python plugins/cc_foundry/bin/build_blueprint_manifest.py \
            --scan-dir plugins --check

  tests:
    name: tests (${{ matrix.scope }}, ${{ matrix.os }}, Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        # General floor 3.11 and the newest release every plugin accepts (codemap-py requires CPython <3.15): the releases between add runner time, not coverage.
        python-version: ["3.11", "3.14"]
        # The Codex suite is the longest leg on every OS (Windows 57 min, macOS 31 min, Ubuntu 14 min), so it runs as two
        # complementary selections, `integration` and `not integration`, on separate runners. Together they select every
        # test exactly once; no xdist_group spans both, so no shared fixture is rebuilt by the second runner.
        scope: ["codex-integration", "codex-unit", "claude", "shared"]
        include:
          # Python 3.10 (the repository minimum) runs on the fastest OS, pinned to one Ubuntu image instead of ubuntu-latest, so a runner migration never changes it.
          - { os: "ubuntu-24.04", python-version: "3.10", scope: "codex-integration" }
          - { os: "ubuntu-24.04", python-version: "3.10", scope: "codex-unit" }
          - { os: "ubuntu-24.04", python-version: "3.10", scope: "claude" }
          - { os: "ubuntu-24.04", python-version: "3.10", scope: "shared" }
    timeout-minutes: 60
    env:
      PYTHONFAULTHANDLER: "1"
      # Coverage tracing added 10-13% to measured runs and is informational, so only the fast Ubuntu leg on Python
      # 3.14 reports it; macOS and Windows run every test untraced, so their OS-specific branches are not measured.
      # Coverage already uses sys.monitoring on 3.14, so no cheaper tracer exists. Re-enable an OS by widening this.
      COVERAGE: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
      PYTEST_ARGS: >-
        -n 4
        -W error::DeprecationWarning --durations=30
        --cov-report=term-missing
        --cov-report=xml:coverage.xml

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🟢 Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # The action's python-version input sets UV_PYTHON, uv's equivalent of --python,
      # so the pytest run below does not repeat the matrix version.
      - name: 📦 Install uv and Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Every runner image configures a system-wide Git LFS filter. The shipped Git helpers strip GIT_* variables, so
      # tests cannot opt out of it, and each executable-filter safety check then runs about a dozen extra Git processes
      # (one process costs 26 ms on Windows against 1.2 ms on Linux). Tests that exercise filter rejection configure
      # their own repository-local filters; the user-level file is redirected by the test configuration.
      - name: 🧹 Remove ambient system Git LFS filter
        shell: bash
        run: |
          sudo_cmd=""
          [ "$RUNNER_OS" = Linux ] && sudo_cmd="sudo"
          $sudo_cmd git config --system --remove-section filter.lfs || echo "::warning::system Git LFS filter was not removed"
          git config --show-origin --get-regexp '^filter\.' || echo "no ambient system Git filters remain"

      # A pytest temp directory plus a 64-character review-workspace name and Git's object paths pass the 260-character
      # Windows path limit, so Git fails with "Filename too long" inside fixtures; a real install sits far shallower.
      - name: 📏 Allow long paths in Git on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --system core.longpaths true

      # Four workers run each scope, including Node, coverage, and subprocess tests; work stealing keeps the
      # few multi-minute tests from landing last on one worker in Claude/shared scopes. Codex uses loadgroup to honor
      # its existing lifecycle fixture groups instead of rebuilding those expensive fixtures on multiple workers.
      # Coverage is opt-in so local runs stay untraced, and
      # its sources stay out of pyproject's [tool.coverage], which would also configure tests that start their own
      # coverage run. The XML report feeds the informational Codecov upload below.
      # Slow-test durations help identify scopes that need further balancing.
      - name: 🧪 Run Codex tests
        if: startsWith(matrix.scope, 'codex')
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          read -r -a pytest_args <<< "$PYTEST_ARGS"
          pytest_args+=(--dist loadgroup)
          # `integration` and `not integration` partition the suite; see the matrix comment above.
          if [ "$SCOPE" = codex-integration ]; then
            pytest_args+=(-m integration)
          else
            pytest_args+=(-m "not integration")
          fi
          if [ "$COVERAGE" = true ]; then
            pytest_args+=(--cov=plugins/codex-rig/bin --cov=plugins/codex-rig/shared \
              --cov=plugins/codex-rig/runtime --cov=plugins/codex-rig/scripts)
          fi
          uv run --only-group test pytest plugins/codex-rig "${pytest_args[@]}"

      - name: 🧪 Run Claude tests
        if: matrix.scope == 'claude'
        run: |
          read -r -a pytest_args <<< "$PYTEST_ARGS"
          if [ "$COVERAGE" = true ]; then
            pytest_args+=(--cov=plugins/cc_develop/bin --cov=plugins/cc_foundry/bin \
              --cov=plugins/cc_oss/bin --cov=plugins/cc_research/bin)
          fi
          uv run --only-group test pytest --dist worksteal \
            plugins/cc_develop plugins/cc_foundry plugins/cc_oss plugins/cc_research \
            "${pytest_args[@]}"

      - name: 🧪 Run shared tests
        if: matrix.scope == 'shared'
        run: |
          read -r -a pytest_args <<< "$PYTEST_ARGS"
          if [ "$COVERAGE" = true ]; then
            pytest_args+=(--cov=plugins/codemap-py/bin --cov=plugins/codemap-py/src \
              --cov=plugins/bridge_cc-codex/bin)
          fi
          uv run --only-group test pytest --dist worksteal \
            plugins/codemap-py plugins/bridge_cc-codex benchmarks tests \
            "${pytest_args[@]}"

      # Coverage is informational only: an upload failure never fails the job, and codecov.yml
      # marks every status as informational so coverage changes never block a merge.
      - name: 📊 Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: ${{ matrix.scope }}-${{ runner.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
