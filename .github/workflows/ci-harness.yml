name: Codex CI harness

on:
  push:
    branches: [main]
    paths:
      - "plugins/codex-rig/**"
      - ".codex/config.toml"
      - ".github/codex-harness.sh"
      - ".github/workflows/ci-harness.yml"
  pull_request:
    paths:
      - "plugins/codex-rig/**"
      - ".codex/config.toml"
      - ".github/codex-harness.sh"
      - ".github/workflows/ci-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  offline-harness:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    timeout-minutes: 10
    env:
      CODEX_HARNESS_RESULTS_DIR: ".github/codex-harness-results"
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_API_BASE: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      MISTRAL_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🤖 Run offline Codex harness
        run: .github/codex-harness.sh

      - name: ⬆️ Upload Codex harness results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-harness-results-${{ matrix.os }}
          path: .github/codex-harness-results/
          if-no-files-found: error
