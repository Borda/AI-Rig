# .codex/config.toml
# OpenAI Codex CLI — project config (Rust CLI v0.105+, TOML only)
# `config_file` paths are relative to this file

model                              = "gpt-6-sol"
review_model                       = "gpt-6-sol"
model_reasoning_effort             = "medium"
model_reasoning_summary            = "auto"
approval_policy                    = "on-request"
personality                        = "pragmatic"
suppress_unstable_features_warning = true
project_doc_fallback_filenames     = ["CONTRIBUTING.md", "CONTRIBUTING", "docs/CONTRIBUTING.md"]
commit_attribution                 = "Co-authored-by: Codex <codex@openai.com>"

[features]
multi_agent = true
personality = true
hooks       = true
network_proxy = true

[permissions.github-read]
extends = ":workspace"

[permissions.github-read.filesystem.":workspace_roots"]
".git" = "write"

[permissions.github-read.network]
enabled = true

[permissions.github-read.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"

[agents]
max_threads             = 4
max_depth               = 2
job_max_runtime_seconds = 3600

[tui]
status_line = [
  "model-with-reasoning",
  "context-used",
  "context-window-size",
  "used-tokens",
]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
