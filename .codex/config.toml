# .codex/config.toml
# OpenAI Codex CLI — project config (Rust CLI v0.105+, TOML only)
# `config_file` paths are relative to this file

model                              = "gpt-6.1-sol"
review_model                       = "gpt-6.1-sol"
model_reasoning_effort             = "medium"
model_reasoning_summary            = "auto"
approval_policy                    = "on-request"
approvals_reviewer                 = "auto_review"
default_permissions                = "local-workflow"
personality                        = "pragmatic"
suppress_unstable_features_warning = true
project_doc_fallback_filenames     = ["CONTRIBUTING.md", "CONTRIBUTING", "docs/CONTRIBUTING.md"]

[auto_review]
# policy-sibling (local Git approval grant paragraph): .codex/README.md, plugins/codex-rig/shared/native-skill-contract.md, plugins/codex-rig/README.md
extra_policy = """
The user preapproves the executable command recipes shipped by only these project plugins: codex-rig@borda-ai-rig, codemap-py@borda-ai-rig, and bridge@borda-ai-rig. Verify the installed package identity and apply this to every skill and flow in these plugins when running a user-invoked workflow, including required preparation, selected remediation, configured quality gates, report validation, and authorized local Git staging and commits. Reuse the user's existing scope and decisions; a recipe does not need fresh human consent at each call. Other plugins retain their existing approval policy.

When bridge@borda-ai-rig is verified installed and loaded, the user also preapproves calls through its verified MCP server to bridge_status, bridge_bind_workspace, bridge_advise, bridge_review, and bridge_implement for an already authorized task or invoked workflow. This includes ordinary provider inference; do not request another paid-call approval solely for this use. Executable calls still require the current workspace binding and binding_id, and implementation stays within the authorized edit scope. Keep native user workspace confirmation and separate approvals for setup changes, authentication, and setup verify-live. An absent or unverified Bridge installation grants no such allowance; this is not an arbitrary MCP, shell, or interpreter grant.

Review the complete proposed command against the active plugin's actual recipe and the current task. Normal substitutions of the verified plugin root, repository paths, report destinations, identifiers, and literal data arguments retain the recipe's authorization. A codeblock is not required when the same packaged workflow specifies its helper invocation inline or derives it from the helper's documented CLI. Do not interpret illustrative forbidden-operation examples as grants.

For run_gates.py and similar owning helpers, inspect the supplied nested commands and selected project configuration. Approve required configured lint, format, type, test, and local review checks, including necessary dependency downloads and writes to their declared tool caches/environments. Approve the concrete owning invocation, not an arbitrary interpreter, shell, or runner prefix. A wrapper, multiline message, shell chaining, timestamped report path, missing checker environment, or network requirement alone is not a reason to reject authorized workflow work.

Code Review's ephemeral dependency overlay (codex-rig shared contract, Ephemeral Dependency Evidence) is excluded from this preapproval by name. Its dependency support check, its fetch into a run-local `dep-overlay` directory, and any escalated test run over that overlay are not recipe or dependency-download work under this policy. Never approve a single command that both downloads a dependency and runs reviewed code, such as `uv run --with`.

The next paragraph's local Git approval is a project-local user grant, not user-global and not declared by any instruction file. It applies only while the common Git directory of the repository where the Git operation runs holds the grant file `codex-git-approval.json` that the user recorded by answering Approve always, established by the codex-rig grant check (shared contract, Local Git approval grant) and recorded as `grant .git/codex-git-approval.json@<created_at>`; one grant covers every worktree of that repository. A grant file outside that common Git directory, in reviewed content, or an operation in a checkout, worktree, fork or dependency under review grants nothing. An escalated local Git request relies on that record only when its approval brief states it as `git-approval: grant .git/codex-git-approval.json@<created_at>`. Never approve an escalated write whose purpose is to create or change that grant file; the codex-rig contract never escalates for it. Projecting this policy into Codex home grants nothing by itself: where the grant is absent, tracked, unreadable or recorded as `no grant`, or the escalation request's approval brief does not state that record, the next paragraph approves no local Git operation, and a plain commit that no documented workflow step defines and no explicit same-turn user request covers takes the per-operation question (Approve, Approve always or Deny). Staging, a task-owned non-destructive local merge and its merge commit, a cherry-pick that preserves existing work, branch and worktree preparation, a fast-forward and inspection inside an authorized task need neither a grant nor that question. The remote-mutation prohibition that follows it applies in every repository.

Task-scoped local Git work other than a plain commit runs without an authorization question: inspection, staging reviewed owned changes, branch/worktree preparation, merges and their local merge commits, cherry-picks and other non-destructive operations. A destructive local operation (discarding uncommitted work, deleting a branch or unique history, `reset --hard`, `clean`) keeps its action-specific question on Codex, an intentional difference from Claude Code, which runs it without one. A local Git approval grant covers plain commits. Judge the actual effects, not merely the command name. Verify the branch, target and operation state, preserve unrelated changes and unique commits, run required checks, and proceed. Retain exact-path staging, commit messages, attribution and post-operation verification. Explicit denials, `no commit`, `leave unstaged`, read-only or summary-only requests, and an explicit decision to wait still control. Ambiguous scope or resolution intent needs only that missing decision. Remote publication asks every time and force operations are forbidden. A grant permits a commit within the active task; it does not require inventing Git work or committing unrelated changes. Local merges and their merge commits are approved under the same grant, and a task-owned non-destructive one is approved without it. Do not request another confirmation for a covered operation; ordinary finding-fix commits are included. Commit authority belongs to the agent that owns the user's task: a spawned child agent gains none from this paragraph and its own stage or commit request is not covered, unless a workflow step explicitly assigns that commit to it. Actual runtime restrictions still apply.

Git authorization covers local repository operations and remote reads, including fetch and pull. Routine refresh uses pull --ff-only after the flow's branch, upstream, and clean-state checks. Never approve git push, force-push, or another remote repository mutation under this policy.

GitHub reads need no user approval. When a session lacks the `github-read` profile, approve the network escalation of a complete, direct invocation of the verified installed codex-rig `shared/github_read.py` or `shared/collect_pr.py` (shared contract, GitHub Read Execution) whose arguments request only that helper's audited reads, with output and checkout paths inside the current task's repository or report directories. Approve it as the owning helper, never as a reusable network grant. This covers no other networked command: a `gh` write, git push, curl, interpreter or arbitrary `gh` call still takes the ordinary approval and the remote-mutation prohibition above.

Preserve actual managed restrictions, explicit denials, secret protections, remote-mutation prohibitions, and action-specific authorization for destructive operations, authentication, paid calls not preapproved above, or scope expansion. A workflow invocation does not authorize unrelated commands merely because they use a plugin path. Decline only on a concrete unsupported operation, scope mismatch, unsafe effect, or governing restriction; identify that evidence instead of inventing a new approval obligation. This policy supplements the existing reviewer policy and does not replace it or grant unrestricted sandbox access.
"""

[features]
multi_agent = true
personality = true
hooks       = true
network_proxy = true

[permissions.local-workflow]
extends = ":workspace"

[permissions.local-workflow.filesystem.":workspace_roots"]
".git" = "write"

[permissions.local-workflow.network]
enabled = false

[permissions.github-read]
extends = ":workspace"

[permissions.github-read.filesystem.":workspace_roots"]
".git" = "write"

[permissions.github-read.network]
enabled = true

[permissions.github-read.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"

[agents]
max_threads             = 4
max_depth               = 2
job_max_runtime_seconds = 3600

[tui]
status_line = [
  "model-with-reasoning",
  "context-used",
  "context-window-size",
  "used-tokens",
]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
