# .codex/config.toml
# OpenAI Codex CLI — project config (Rust CLI v0.105+, TOML only)
# `config_file` paths are relative to this file

model                              = "gpt-6.1-sol"
review_model                       = "gpt-6.1-sol"
model_reasoning_effort             = "medium"
model_reasoning_summary            = "auto"
approval_policy                    = "on-request"
approvals_reviewer                 = "auto_review"
default_permissions                = "local-workflow"
personality                        = "pragmatic"
suppress_unstable_features_warning = true
project_doc_fallback_filenames     = ["CONTRIBUTING.md", "CONTRIBUTING", "docs/CONTRIBUTING.md"]

[auto_review]
extra_policy = """
The user preapproves the executable command recipes shipped by only these project plugins: codex-rig@borda-ai-rig, codemap-py@borda-ai-rig, and bridge@borda-ai-rig. Verify the installed package identity and apply this to every skill and flow in these plugins when running a user-invoked workflow, including required preparation, selected remediation, configured quality gates, report validation, and authorized local Git staging and commits. Reuse the user's existing scope and decisions; a recipe does not need fresh human consent at each call. Other plugins retain their existing approval policy.

When bridge@borda-ai-rig is verified installed and loaded, the user also preapproves calls through its verified MCP server to bridge_status, bridge_bind_workspace, bridge_advise, bridge_review, and bridge_implement for an already authorized task or invoked workflow. This includes ordinary provider inference; do not request another paid-call approval solely for this use. Executable calls still require the current workspace binding and binding_id, and implementation stays within the authorized edit scope. Keep native user workspace confirmation and separate approvals for setup changes, authentication, and setup verify-live. An absent or unverified Bridge installation grants no such allowance; this is not an arbitrary MCP, shell, or interpreter grant.

Review the complete proposed command against the active plugin's actual recipe and the current task. Normal substitutions of the verified plugin root, repository paths, report destinations, identifiers, and literal data arguments retain the recipe's authorization. A codeblock is not required when the same packaged workflow specifies its helper invocation inline or derives it from the helper's documented CLI. Do not interpret illustrative forbidden-operation examples as grants.

For run_gates.py and similar owning helpers, inspect the supplied nested commands and selected project configuration. Approve required configured lint, format, type, test, and local review checks, including necessary dependency downloads and writes to their declared tool caches/environments. Approve the concrete owning invocation, not an arbitrary interpreter, shell, or runner prefix. A wrapper, multiline message, shell chaining, timestamped report path, missing checker environment, or network requirement alone is not a reason to reject authorized workflow work.

Code Review's ephemeral dependency overlay (codex-rig shared contract, Ephemeral Dependency Evidence) is excluded from this preapproval by name. Its dependency support check, its fetch into a run-local `dep-overlay` directory, and any escalated test run over that overlay are not recipe or dependency-download work under this policy. Never approve a single command that both downloads a dependency and runs reviewed code, such as `uv run --with`.

Git authorization covers local repository operations and remote reads, including fetch and pull. Routine refresh uses pull --ff-only after the flow's branch, upstream, and clean-state checks. Never approve git push, force-push, or another remote repository mutation under this policy.

Preserve actual managed restrictions, explicit denials, secret protections, remote-mutation prohibitions, and action-specific authorization for destructive operations, authentication, paid calls not preapproved above, or scope expansion. A workflow invocation does not authorize unrelated commands merely because they use a plugin path. Decline only on a concrete unsupported operation, scope mismatch, unsafe effect, or governing restriction; identify that evidence instead of inventing a new approval obligation. This policy supplements the existing reviewer policy and does not replace it or grant unrestricted sandbox access.
"""

[features]
multi_agent = true
personality = true
hooks       = true
network_proxy = true

[permissions.local-workflow]
extends = ":workspace"

[permissions.local-workflow.filesystem.":workspace_roots"]
".git" = "write"

[permissions.local-workflow.network]
enabled = false

[permissions.github-read]
extends = ":workspace"

[permissions.github-read.filesystem.":workspace_roots"]
".git" = "write"

[permissions.github-read.network]
enabled = true

[permissions.github-read.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"

[agents]
max_threads             = 4
max_depth               = 2
job_max_runtime_seconds = 3600

[tui]
status_line = [
  "model-with-reasoning",
  "context-used",
  "context-window-size",
  "used-tokens",
]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
